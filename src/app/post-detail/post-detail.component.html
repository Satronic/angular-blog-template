
<article class="post-detail-container" *ngIf="post">
  <!-- <img src="https://via.placeholder.com/1000x300" alt="Post Image" class="post-image"> -->
  <h2 class="post-title">{{ post.title }}</h2>
  <div class="post-content" [innerHTML]="post.body"></div>
  <button class="back-button" (click)="goBack()">Back to Posts</button>
</article>
